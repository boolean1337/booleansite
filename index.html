<div id="ui"><b>BRUTAL SANDBOX VR</b><br>Хват — взять · Курок — выстрел/применить · Левый стик — ходьба · Правый — поворот · Тыкай пальцем в панель на стене (без VR — мышкой)<br><button id="vr" disabled>…</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
const V3=THREE.Vector3,UP=new V3(0,1,0),cv=v=>new CANNON.Vec3(v.x,v.y,v.z),rnd=(a=1)=>(Math.random()-.5)*a;
const S={dis:1,blood:1,cens:0,col:0,grav:0};
const COLS=['#b00000','#2fd24a','#2b7bff','#ff4fd8','#0a0a0a'],COLN=['красная','зелёная','синяя','розовая','чёрная'],GR=[-9.8,-1.6,0];
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.localClippingEnabled=true;renderer.xr.enabled=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2a2a2e);scene.fog=new THREE.Fog(0x2a2a2e,8,30);
const rig=new THREE.Group();rig.position.set(0,0,.6);scene.add(rig);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,60);cam.position.set(0,1.6,0);rig.add(cam);
scene.add(new THREE.HemisphereLight(0xffffff,0x444455,.9));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(2,5,3);scene.add(dl);
const conc=new THREE.MeshStandardMaterial({color:0x7a7a7a,roughness:1});
const fl=new THREE.Mesh(new THREE.PlaneGeometry(40,40),conc);fl.rotation.x=-Math.PI/2;scene.add(fl);
const wl=new THREE.Mesh(new THREE.BoxGeometry(12,6,.2),conc);wl.position.set(0,3,-2.2);scene.add(wl);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// ---- physics
const W=new CANNON.World();W.gravity.set(0,-9.8,0);W.solver.iterations=14;W.broadphase=new CANNON.SAPBroadphase(W);W.defaultContactMaterial.friction=.5;W.defaultContactMaterial.restitution=.05;
const gb=new CANNON.Body({mass:0,shape:new CANNON.Plane()});gb.quaternion.setFromEuler(-Math.PI/2,0,0);W.addBody(gb);
const wb=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(6,3,.1))});wb.position.set(0,3,-2.2);W.addBody(wb);
const items=[],joints=[],npcs=[],fxs=[],IDQ=new CANNON.Quaternion(0,0,0,1);
const innerCol=()=>S.blood?(S.cens?'#444':COLS[S.col]):'#e8dcc8';
function addItem(body,obj,o){const g=new THREE.Group();g.add(obj);scene.add(g);W.addBody(body);const it=Object.assign({body,g,cdT:0},o);body.it=it;items.push(it);return it}
function mkPiece(body,geo,h,npc,cuts,eyes){const planes=cuts.map(()=>new THREE.Plane());
 const skin=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x6a6cff,roughness:.55,clippingPlanes:planes}));
 const inner=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:innerCol(),side:THREE.BackSide,clippingPlanes:planes}));
 const o=new THREE.Group();o.add(skin,inner);
 if(eyes)for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.018,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));e.position.set(s*.04,.02,-.092);o.add(e)}
 return addItem(body,o,{skin,inner,cuts,planes,h,npc,dmg:0,cd:0})}
const mkBody=(m,sh)=>{const b=new CANNON.Body({mass:m,linearDamping:.15,angularDamping:.35});b.addShape(sh);b.collisionFilterGroup=2;b.collisionFilterMask=1;return b};
function mkJoint(a,b,pa,pb){const j={a,b,pa,pb};j.c=new CANNON.PointToPointConstraint(a.body,cv(pa),b.body,cv(pb));W.addConstraint(j.c);joints.push(j)}
// ---- NPC
const SEG=[['pelvis',[.15,.1,.09],[0,1,0],10],['chest',[.19,.2,.1],[0,1.3,0],14],['head',[.1,.11,.1],[0,1.66,0],5],
['uaL',[.045,.14,.045],[-.25,1.4,0],2.5],['uaR',[.045,.14,.045],[.25,1.4,0],2.5],['faL',[.04,.14,.04],[-.25,1.12,0],2],['faR',[.04,.14,.04],[.25,1.12,0],2],
['thL',[.07,.2,.07],[-.09,.7,0],7],['thR',[.07,.2,.07],[.09,.7,0],7],['shL',[.06,.25,.06],[-.09,.25,0],4],['shR',[.06,.25,.06],[.09,.25,0],4]];
const JT=[['pelvis','chest',[0,1.1,0]],['chest','head',[0,1.53,0]],['chest','uaL',[-.25,1.5,0]],['chest','uaR',[.25,1.5,0]],['uaL','faL',[-.25,1.26,0]],['uaR','faR',[.25,1.26,0]],
['pelvis','thL',[-.09,.9,0]],['pelvis','thR',[.09,.9,0]],['thL','shL',[-.09,.5,0]],['thR','shR',[.09,.5,0]]];
function spawnNPC(kind){const x=rnd(1.4),z=-1+rnd(.4),y0=kind=='ragdoll'?.6:.02,npc={kind,active:kind!='ragdoll',ax:x,az:z,t:0,its:[]},m={};npcs.push(npc);
 SEG.forEach(([n,h,p,mass])=>{const b=mkBody(mass,new CANNON.Box(new CANNON.Vec3(h[0],h[1],h[2])));b.position.set(p[0]+x,p[1]+y0,p[2]+z);
  const geo=/^(pelvis|chest|head)$/.test(n)?new THREE.SphereGeometry(1,16,12).scale(h[0],h[1],h[2]):new THREE.CylinderGeometry(h[0],h[0],h[1]*2,12);
  const it=mkPiece(b,geo,h,npc,[],n=='head');it.off=p;it.n=n;npc.its.push(it);m[n]=it;if(kind=='ragdoll')b.velocity.set(rnd(2),0,rnd(2))});
 JT.forEach(([a,b,p])=>{const w=new V3(p[0]+x,p[1]+y0,p[2]+z),A=m[a],B=m[b],l=(it)=>new V3(w.x-it.body.position.x,w.y-it.body.position.y,w.z-it.body.position.z);mkJoint(A,B,l(A),l(B))})}
W.addEventListener('preStep',()=>{npcs.forEach(n=>{if(!n.active)return;n.t+=1/60;
 if(n.kind=='walk'){const c=cam.getWorldPosition(new V3),dx=c.x-n.ax,dz=c.z-n.az,d=Math.hypot(dx,dz);if(d>1.1){n.ax+=dx/d*.5/60;n.az+=dz/d*.5/60}}
 n.its.forEach(it=>{const b=it.body,p=it.off,m=b.mass;let tz=0,ty=0;
  if(n.kind=='walk'){const s=Math.sin(n.t*4+(it.n.endsWith('R')?Math.PI:0));if(it.n[0]=='t')tz=s*.15;if(it.n[0]=='s'){tz=s*.2;ty=Math.max(0,-s)*.1}if(it.n[1]=='a')tz=-s*.1}
  b.force.x+=m*(60*(n.ax+p[0]-b.position.x)-9*b.velocity.x);b.force.y+=m*(60*(p[1]+ty-b.position.y)-9*b.velocity.y-W.gravity.y);b.force.z+=m*(60*(n.az+p[2]+tz-b.position.z)-9*b.velocity.z);
  b.quaternion.slerp(IDQ,.2,b.quaternion);b.angularVelocity.scale(.7,b.angularVelocity)})})});
// ---- props & weapons
function prop(k){let sh,geo,mass=3,col=0x8a6a4a;
 if(k=='box'){sh=new CANNON.Box(new CANNON.Vec3(.15,.15,.15));geo=new THREE.BoxGeometry(.3,.3,.3)}
 else if(k=='ball'){sh=new CANNON.Sphere(.18);geo=new THREE.SphereGeometry(.18,16,12);col=0xd04a3a;mass=1.5}
 else if(k=='barrel'){sh=new CANNON.Box(new CANNON.Vec3(.2,.3,.2));geo=new THREE.CylinderGeometry(.2,.2,.6,16);col=0x3a6a8a;mass=8}
 else{sh=new CANNON.Box(new CANNON.Vec3(.4,.05,.4));geo=new THREE.BoxGeometry(.8,.1,.8);col=0x888888;mass=15}
 const b=new CANNON.Body({mass,linearDamping:.1,angularDamping:.2});b.addShape(sh);b.position.set(rnd(1.4),1.4,-1+rnd(.4));b.quaternion.setFromEuler(rnd(1),rnd(3),rnd(1));
 addItem(b,new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:.8})),{})}
const WD={
 pistol:{m:.8,gun:{len:.18,imp:5,cd:.18,n:1,sp:.003},p:[[.03,.045,.2,0,.01,-.08,0x222222],[.034,.11,.05,0,-.07,0,0x151515]]},
 shotgun:{m:3,gun:{len:.75,imp:3,cd:.8,n:8,sp:.05},p:[[.04,.04,.75,0,.02,-.37,0x1a1a1a],[.035,.035,.55,0,-.02,-.28,0x222222],[.055,.05,.22,0,-.02,-.25,0x111111],[.05,.09,.25,0,0,.02,0x222222],[.045,.09,.25,0,-.01,.25,0x1b1b1b],[.04,.1,.05,0,-.08,.08,0x111111]]},
 rifle:{m:3,gun:{len:.55,imp:4,cd:.09,n:1,sp:.01,auto:1},p:[[.03,.03,.5,0,.02,-.3,0x222222],[.05,.09,.32,0,0,0,0x2a2a2a],[.03,.14,.05,0,-.1,-.02,0x111111],[.035,.1,.04,0,-.08,.1,0x111111],[.04,.08,.25,0,0,.24,0x222222]]},
 grenade:{m:.5,gren:1,p:[[.07,.1,.07,0,0,0,0x5b5e3a,1],[.064,.016,.064,0,.045,0,0xe0b000],[.015,.1,.03,.04,.02,0,0x777b80]]},
 knife:{m:.3,blade:{len:.2},p:[[.008,.04,.2,0,0,-.1,0x8a8f95],[.025,.03,.11,0,0,.055,0x6b3a1e]]},
 machete:{m:.6,blade:{len:.45},p:[[.01,.07,.45,0,0,-.225,0x777b80],[.026,.032,.12,0,0,.06,0x5a3015]]},
 katana:{m:1,blade:{len:.8},p:[[.008,.035,.8,0,0,-.4,0x16161a],[.07,.07,.01,0,0,0,0xd4af37],[.03,.03,.25,0,0,.13,0x5a1020]]}};
function weapon(k){const d=WD[k],b=new CANNON.Body({mass:d.m,linearDamping:.05,angularDamping:.1}),o=new THREE.Group();
 d.p.forEach(([w,h,dp,x,y,z,c,s])=>{b.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,dp/2)),new CANNON.Vec3(x,y,z));
  const m=new THREE.Mesh(s?new THREE.SphereGeometry(.5,12,10):new THREE.BoxGeometry(w,h,dp),new THREE.MeshStandardMaterial({color:c,roughness:.4,metalness:.5}));if(s)m.scale.set(w,h,dp);m.position.set(x,y,z);o.add(m)});
 b.position.set(rnd(1.4),1.2,-1+rnd(.4));b.quaternion.setFromEuler(rnd(1),rnd(3),0);addItem(b,o,{gun:d.gun,blade:d.blade,gren:d.gren})}
// ---- blood / fx
const BP=[],bMat=new THREE.MeshBasicMaterial({color:COLS[0]}),cMat=new THREE.MeshBasicMaterial({color:0x777777});let bi=0;
for(let i=0;i<350;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.02,.02,.02),bMat);m.visible=false;scene.add(m);BP.push({m,v:new V3,rest:true})}
function bloodAt(p,dir,n,sp){if(!S.blood)return;for(let i=0;i<n;i++){const q=BP[bi++%350];q.m.visible=true;q.m.position.copy(p);q.m.scale.setScalar(S.cens?2.5:1);q.m.material=S.cens?cMat:bMat;q.rest=false;q.v.set(rnd(2),rnd(2)+.5,rnd(2)).addScaledVector(dir,sp)}}
function flash(p,c,r,life){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({color:c,transparent:true}));m.position.copy(p);scene.add(m);fxs.push({m,t:life,l:life})}
function refresh(){bMat.color.set(COLS[S.col]);items.forEach(it=>it.inner&&it.inner.material.color.set(innerCol()))}
// ---- damage
function breakJ(j){W.removeConstraint(j.c);const i=joints.indexOf(j);if(i>=0)joints.splice(i,1);const p=j.a.body.pointToWorldFrame(cv(j.pa));bloodAt(new V3(p.x,p.y,p.z),UP,22,1.5);if(j.a.npc)j.a.npc.active=false}
function ripCheck(){if(!S.dis)return;joints.slice().forEach(j=>{if(j.a.body.pointToWorldFrame(cv(j.pa)).distanceTo(j.b.body.pointToWorldFrame(cv(j.pb)))>.12)breakJ(j)})}
function slice(it,n,p){it.cd=.4;const qi=it.g.quaternion.clone().invert(),nl=n.clone().applyQuaternion(qi),pl=p.clone().sub(it.g.position).applyQuaternion(qi),b=it.body;
 const nb=new CANNON.Body({mass:b.mass/2,linearDamping:.15,angularDamping:.35});b.shapes.forEach((s,i)=>nb.addShape(s,b.shapeOffsets[i].clone()));b.mass/=2;b.updateMassProperties();
 nb.position.copy(b.position);nb.quaternion.copy(b.quaternion);nb.velocity.copy(b.velocity);nb.angularVelocity.copy(b.angularVelocity);nb.collisionFilterGroup=2;nb.collisionFilterMask=1;
 const B=mkPiece(nb,it.skin.geometry,it.h,it.npc,it.cuts.map(c=>({n:c.n.clone(),p:c.p.clone()})),0);B.cuts.push({n:nl.clone().negate(),p:pl.clone()});B.planes.push(new THREE.Plane());B.cd=.4;B.n=it.n;B.off=it.off;
 it.cuts.push({n:nl,p:pl});it.planes.push(new THREE.Plane());[it,B].forEach(x=>{x.skin.material.needsUpdate=true;x.inner.material.needsUpdate=true});
 joints.slice().forEach(j=>[['a','pa'],['b','pb']].forEach(([k,pk])=>{if(j[k]===it&&nl.dot(j[pk].clone().sub(pl))<0){W.removeConstraint(j.c);j[k]=B;j.c=new CANNON.PointToPointConstraint(j.a.body,cv(j.pa),j.b.body,cv(j.pb));W.addConstraint(j.c)}}));
 const k=.8;b.velocity.x+=n.x*k;b.velocity.y+=n.y*k;b.velocity.z+=n.z*k;nb.velocity.x-=n.x*k;nb.velocity.y-=n.y*k;nb.velocity.z-=n.z*k;
 if(it.npc)it.npc.active=false;bloodAt(p,n,28,2)}
function bladeCheck(){if(!S.dis)return;items.slice().forEach(bl=>{if(!bl.blade)return;const v=bl.body.velocity;if(v.length()<2.2)return;
 const dir=new V3(0,0,-1).applyQuaternion(bl.g.quaternion),n=new V3().crossVectors(dir,new V3(v.x,v.y,v.z).normalize());if(n.length()<.2)return;n.normalize();
 items.slice().forEach(it=>{if(!it.skin||it.cd>0||it.cuts.length>=3)return;const qi=it.g.quaternion.clone().invert();
  for(const f of[.3,.55,.8]){const p=bl.g.position.clone().addScaledVector(dir,bl.blade.len*f),l=p.clone().sub(it.g.position).applyQuaternion(qi);
   if(Math.abs(l.x)<it.h[0]+.02&&Math.abs(l.y)<it.h[1]+.02&&Math.abs(l.z)<it.h[2]+.02){slice(it,n,p);break}}})})}
function fire(it){const g=it.gun,from=new V3(0,.015,-g.len).applyQuaternion(it.g.quaternion).add(it.g.position);
 for(let i=0;i<g.n;i++){const dir=new V3(rnd(g.sp*2),rnd(g.sp*2),-1).normalize().applyQuaternion(it.g.quaternion),r=new CANNON.RaycastResult();
  W.raycastClosest(cv(from),cv(from.clone().addScaledVector(dir,30)),{},r);
  if(r.hasHit){const hb=r.body,hp_=r.hitPointWorld;hb.applyImpulse(cv(dir.clone().multiplyScalar(g.imp)),new CANNON.Vec3(hp_.x-hb.position.x,hp_.y-hb.position.y,hp_.z-hb.position.z));
   const h=hb.it;if(h&&h.npc){h.dmg++;h.npc.active=false;bloodAt(new V3(hp_.x,hp_.y,hp_.z),dir,6,2);if(S.dis&&h.dmg>=4)joints.filter(j=>j.a===h||j.b===h).forEach(breakJ)}}}
 flash(from,0xffdd88,.06,.05);it.cdT=g.cd}
function boom(it){const p=new V3(it.body.position.x,it.body.position.y,it.body.position.z);flash(p,0xffaa33,.7,.3);
 items.slice().forEach(o=>{if(o===it)return;const d=p.distanceTo(new V3(o.body.position.x,o.body.position.y,o.body.position.z));if(d<4){const dir=new V3(o.body.position.x-p.x,o.body.position.y-p.y+.3,o.body.position.z-p.z).normalize().multiplyScalar(o.body.mass*14/(d+.5));o.body.applyImpulse(cv(dir),new CANNON.Vec3());
  if(o.npc&&d<2.2){o.dmg+=10;o.npc.active=false;bloodAt(new V3(o.body.position.x,o.body.position.y,o.body.position.z),UP,12,2)}}});
 if(S.dis)joints.slice().forEach(j=>{const w=j.a.body.pointToWorldFrame(cv(j.pa));if(p.distanceTo(new V3(w.x,w.y,w.z))<1.6)breakJ(j)});
 hands.forEach(H=>{if(H.held===it)release(H)});rm(it)}
function rm(it){W.removeBody(it.body);scene.remove(it.g);items.splice(items.indexOf(it),1)}
function clearAll(){hands.forEach(release);joints.forEach(j=>W.removeConstraint(j.c));joints.length=0;items.slice().forEach(rm);npcs.length=0;BP.forEach(q=>{q.m.visible=false;q.rest=true})}
// ---- wall panel
const pc=document.createElement('canvas');pc.width=512;pc.height=400;const px=pc.getContext('2d'),ptex=new THREE.CanvasTexture(pc);
const panel=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.25),new THREE.MeshBasicMaterial({map:ptex}));panel.position.set(0,1.35,-2.09);scene.add(panel);
let tab=0,hov=-1;const oo=v=>v?'ВКЛ':'ВЫКЛ';
const PG=[['Мир',[[()=>'Расчленение: '+oo(S.dis),()=>{S.dis=S.dis?0:1}],[()=>'Кровь: '+oo(S.blood),()=>{S.blood=S.blood?0:1;refresh()}],[()=>'Цензура: '+oo(S.cens),()=>{S.cens=S.cens?0:1;refresh()}],[()=>'Кровь: '+COLN[S.col],()=>{S.col=(S.col+1)%5;refresh()}],[()=>'Гравитация: '+['земля','луна','ноль'][S.grav],()=>{S.grav=(S.grav+1)%3;W.gravity.y=GR[S.grav]}],['Очистить всё',clearAll]]],
['Объекты',[['Ящик',()=>prop('box')],['Шар',()=>prop('ball')],['Бочка',()=>prop('barrel')],['Плита',()=>prop('slab')]]],
['Спавнер',[['НПС: рэгдолл',()=>spawnNPC('ragdoll')],['НПС: ходячий',()=>spawnNPC('walk')],['НПС: стоячий',()=>spawnNPC('stand')],['Пистолет',()=>weapon('pistol')],['Дробовик',()=>weapon('shotgun')],['Автомат',()=>weapon('rifle')],['Граната',()=>weapon('grenade')],['Нож',()=>weapon('knife')],['Катана',()=>weapon('katana')],['Мачете',()=>weapon('machete')]]]];
const rect=i=>[12+(i%2)*250,70+(i>>1)*62,238,54];
function draw(){px.fillStyle='#17171b';px.fillRect(0,0,512,400);px.textAlign='center';
 PG.forEach((p,i)=>{px.fillStyle=i==tab?'#6a6cff':'#2a2a31';px.fillRect(i*171,0,169,56);px.fillStyle='#fff';px.font='bold 26px sans-serif';px.fillText(p[0],i*171+85,37)});
 PG[tab][1].forEach((b,i)=>{const r=rect(i);px.fillStyle=hov==i?'#4a4cc0':'#33333c';px.fillRect(...r);px.fillStyle='#fff';px.font='22px sans-serif';px.fillText(typeof b[0]=='function'?b[0]():b[0],r[0]+r[2]/2,r[1]+34)});ptex.needsUpdate=true}
function hit(u,v){if(v<56)return{t:Math.min(2,Math.floor(u/171))};for(let i=0;i<PG[tab][1].length;i++){const r=rect(i);if(u>r[0]&&u<r[0]+r[2]&&v>r[1]&&v<r[1]+r[3])return{b:i}}return{}}
function press(u,v){const h=hit(u,v);if(h.t!=null){tab=h.t;hov=-1}else if(h.b!=null)PG[tab][1][h.b][1]();draw()}
draw();const rc=new THREE.Raycaster(),mp=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(mp,cam);const i=rc.intersectObject(panel)[0];if(i)press(i.uv.x*512,(1-i.uv.y)*400)});
// ---- player: hands, arms, body
const pm=new THREE.MeshStandardMaterial({color:0x6a6cff,roughness:.6});
function mkHand(sd){const g=new THREE.Group(),bx=(w,h,d,x,y,z,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),pm);m.position.set(x,y,z);p.add(m)};bx(.085,.025,.09,0,0,.01,g);
