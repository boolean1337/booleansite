<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;overflow:hidden;background:#111}#hint{position:fixed;left:8px;top:8px;color:#fff;font:12px/1.4 sans-serif;background:#0008;padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="hint"></div><script type="module">
import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
/* Rilla VR: three.js + WebXR. Физика своя (сферы vs AABB) вместо cannon-es — легче для Quest. */

/* ===== РЕНДЕР ===== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,120);camera.position.y=1.6;camera.rotation.order='YXZ';
const rig=new THREE.Group();rig.add(camera);scene.add(rig);   // rig = «пол» игрока
const hemi=new THREE.HemisphereLight(0xfff4e6,0x8d7f6e,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.35);sun.position.set(3,8,4);scene.add(sun);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ===== ПРОЦЕДУРНЫЕ ТЕКСТУРЫ ===== */
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(777);
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
const T={
 wood:cvs(256,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=`hsl(30,${40+rnd()*10}%,${42+rnd()*12}%)`;g.fillRect(0,i*32,w,31);}}),
 wall:cvs(128,128,(g,w,h)=>{g.fillStyle='#efe3cf';g.fillRect(0,0,w,h);g.fillStyle='#e2d3b8';for(let x=0;x<w;x+=16)g.fillRect(x,0,6,h);}),
 tile:cvs(128,128,(g,w,h)=>{g.fillStyle='#dfe3ea';g.fillRect(0,0,w,h);g.strokeStyle='#9aa3b5';g.lineWidth=3;g.strokeRect(0,0,w,h);}),
 bwall:cvs(128,128,(g,w,h)=>{g.fillStyle='#cbb65a';g.fillRect(0,0,w,h);g.fillStyle='#b8a247';for(let x=0;x<w;x+=20)g.fillRect(x,0,8,h);for(let i=0;i<14;i++){g.fillStyle='rgba(90,70,10,.08)';g.beginPath();g.arc(rnd()*w,rnd()*h,8+rnd()*16,0,7);g.fill();}}),
 bcarp:cvs(128,128,(g,w,h)=>{g.fillStyle='#8c7c38';g.fillRect(0,0,w,h);for(let i=0;i<1500;i++){g.fillStyle=`rgba(${60+rnd()*60|0},${50+rnd()*50|0},10,.35)`;g.fillRect(rnd()*w,rnd()*h,2,2);}}),
 fur:cvs(128,128,(g,w,h)=>{g.fillStyle='#e0e0e0';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){const v=150+rnd()*90|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(rnd()*w,rnd()*h,2,6);}}),
 rug:cvs(256,256,(g,w,h)=>{['#8a3b3b','#e8d9b5','#3b5d8a','#e8d9b5','#c98a3b'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(128,128,126-i*24,0,7);g.fill();});})
};
function M(tex,rx=1,ry=1,color=0xffffff){const t=tex.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return new THREE.MeshLambertMaterial({map:t,color});}
const plain=c=>new THREE.MeshLambertMaterial({color:c});
function sign(text,w,h,bg='#223',fg='#fff'){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:cvs(512,Math.round(512*h/w),(g,cw,ch)=>{g.fillStyle=bg;g.fillRect(0,0,cw,ch);g.fillStyle=fg;g.font='bold 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,cw/2,ch/2);})}));}

/* ===== МИР: коллайдеры (AABB) — всё это grabSurfaces ===== */
const colliders=[];
function box(x,y,z,w,h,d,mat,solid=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);if(solid)colliders.push({min:new THREE.Vector3(x-w/2,y-h/2,z-d/2),max:new THREE.Vector3(x+w/2,y+h/2,z+d/2)});return m;}
function room(cx,cz,w,d,h,fT,wT,ceil){
 box(cx,-.25,cz,w,.5,d,M(fT[0],w/fT[1],d/fT[1]));
 const wm=(l)=>M(wT[0],l/wT[1],h/wT[1]);
 box(cx,h/2,cz-d/2-.2,w+.8,h,.4,wm(w));box(cx,h/2,cz+d/2+.2,w+.8,h,.4,wm(w));
 box(cx-w/2-.2,h/2,cz,.4,h,d,wm(d));box(cx+w/2+.2,h/2,cz,.4,h,d,wm(d));
 if(ceil)box(cx,h+.2,cz,w+.8,.4,d+.8,ceil);
}
const emis=new THREE.MeshBasicMaterial({color:0xfff2d8});
function plant(x,z){box(x,.2,z,.4,.4,.4,plain(0x6b4a2f));const l=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),plain(0x3f9a4a));l.position.set(x,.75,z);scene.add(l);}

/* --- Зона 0: главная комната (настройка персонажа) --- */
room(0,0,12,12,3.4,[T.wood,3],[T.wall,3],plain(0xf4ead8));
for(const [x,z] of[[-2.5,-2.5],[2.5,-2.5],[-2.5,2.5],[2.5,2.5]]){const p=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),emis);p.rotation.x=Math.PI/2;p.position.set(x,3.38,z);scene.add(p);}
for(const [x,z] of[[-3,-3],[3,3]]){const l=new THREE.PointLight(0xffd9a8,7,12,2);l.position.set(x,2.8,z);scene.add(l);}
const rug=new THREE.Mesh(new THREE.CircleGeometry(2.4,32),new THREE.MeshLambertMaterial({map:T.rug}));rug.rotation.x=-Math.PI/2;rug.position.set(0,.01,1);scene.add(rug);
box(4,.25,3.5,2.2,.5,.9,plain(0x7a5c8f));box(4,.7,3.9,2.2,.6,.25,plain(0x6a4c7f));
box(5.75,1,-1,.4,2,2.5,plain(0x8a6b4a));
for(let i=0;i<6;i++)box(5.5,.6+(i%3)*.6,-1.8+i*.35,.2,.3,.25,plain([0xd94040,0x3f6fe0,0xf2d03b][i%3]),false);
[[-5.2,-5.2],[5.2,-5.2],[-5.2,5.2],[5.2,5.2],[-5.2,3]].forEach(p=>plant(...p));
const mirrorGroup=new THREE.Group();scene.add(mirrorGroup);
{const fr=new THREE.Mesh(new THREE.BoxGeometry(.1,2.7,2.5),plain(0x3a2a1a));fr.position.set(-5.97,1.6,0);mirrorGroup.add(fr);
 const mr=new Reflector(new THREE.PlaneGeometry(2.3,2.5),{textureWidth:512,textureHeight:512,color:0xcccccc,clipBias:.003});mr.position.set(-5.9,1.6,0);mr.rotation.y=Math.PI/2;mirrorGroup.add(mr);}
/* Компьютер на задней стене */
const sign0=sign('RILLA — настройка персонажа',2.4,.5,'#2a1f3a');sign0.position.set(0,2.5,-5.97);scene.add(sign0);
box(0,.4,-5.4,2.2,.8,.9,plain(0x5a4a3a));
box(0,1.15,-5.7,1.1,.7,.06,plain(0x111111));
const scr=document.createElement('canvas');scr.width=512;scr.height=300;const sg=scr.getContext('2d');const sTex=new THREE.CanvasTexture(scr);sTex.colorSpace=THREE.SRGBColorSpace;
const screen=new THREE.Mesh(new THREE.PlaneGeometry(1,.6),new THREE.MeshBasicMaterial({map:sTex}));screen.position.set(0,1.15,-5.665);scene.add(screen);
const panel=new THREE.Group();panel.position.set(0,.84,-5.12);panel.rotation.x=.5;scene.add(panel);
panel.add(new THREE.Mesh(new THREE.BoxGeometry(.64,.03,.4),plain(0x222222)));

/* --- Зона 1: тестовая --- */
const TX=40;
room(TX,0,22,22,7,[T.tile,4],[T.wall,3],null);
{const s=sign('ТЕСТ-ЗОНА',3,.6,'#124','#8cf');s.position.set(TX,3,-10.97);scene.add(s);}
[[-5,-4],[6,-6],[0,6]].forEach(([x,z])=>box(TX+x,1.5,z,.6,3,.6,plain(0x6a7a99)));
box(TX+8,1,5,5,2,.5,plain(0x99806a));
for(const [x,z] of[[-5,-5],[0,0],[5,-5]]){const d=new THREE.Mesh(new THREE.CircleGeometry(.9,24),plain(0x445));d.rotation.x=-Math.PI/2;d.position.set(TX+x,.01,z);scene.add(d);}

/* --- Зона 2: Backrooms --- */
const BX=-60,N=10,CS=4;
room(BX,0,N*CS,N*CS,3,[T.bcarp,3],[T.bwall,3],plain(0xd8cf9a));
{const wm=M(T.bwall,1.3,1);
 for(let i=1;i<N;i++)for(let j=0;j<N;j++){
  const vx=BX-N*CS/2+i*CS,vz=-N*CS/2+j*CS+CS/2;
  if(Math.hypot(vx-BX,vz)>5&&rnd()<.33)box(vx,1.5,vz,.3,3,CS,wm);
  const hx=BX-N*CS/2+j*CS+CS/2,hz=-N*CS/2+i*CS;
  if(Math.hypot(hx-BX,hz)>5&&rnd()<.33)box(hx,1.5,hz,CS,3,.3,wm);}
 for(let i=0;i<5;i++)for(let j=0;j<5;j++){const p=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.6),emis);p.rotation.x=Math.PI/2;p.position.set(BX-16+i*8,2.98,-16+j*8);scene.add(p);}}
const backLight=new THREE.PointLight(0xfff0a0,0,14,2);scene.add(backLight);

/* ===== ЗОНЫ / ТЕЛЕПОРТ ===== */
const ZONES=[{n:'Главная',p:[0,0,0],bg:0xf3e6d3,fog:null,h:1.1},{n:'Тест',p:[TX,0,8],bg:0xcfd8e8,fog:new THREE.Fog(0xcfd8e8,30,70),h:1.0},{n:'Backrooms',p:[BX+2,0,2],bg:0x6b6322,fog:new THREE.Fog(0x6b6322,3,22),h:.8}];
let zone=0;
function setZone(i){zone=i;const z=ZONES[i];rig.position.set(...z.p);rig.rotation.y=0;P.vel.set(0,0,0);scene.background=new THREE.Color(z.bg);scene.fog=z.fog;hemi.intensity=z.h;backLight.intensity=i===2?6:0;}

/* ===== ГИБКИЕ ПАЛЬЦЫ / РУКА ===== */
function makeHand(side,mat){
 const g=new THREE.Group(),s=side==='left'?-1:1;g.f={};g.claws=[];
 const palm=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat);palm.scale.set(.046,.02,.052);palm.position.z=-.03;g.add(palm);
 const cuff=new THREE.Mesh(new THREE.CylinderGeometry(.03,.035,.06,12),plain(0x222a33));cuff.rotation.x=Math.PI/2;cuff.position.z=.04;g.add(cuff);
 const cap=(l,r)=>{const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,l,4,8),mat);m.rotation.x=Math.PI/2;m.position.z=-l/2;return m;};
 const mk=(k,x,z,len,r,yaw)=>{const p1=new THREE.Group();p1.position.set(x,0,z);p1.rotation.y=yaw;p1.add(cap(len,r));
  const p2=new THREE.Group();p2.position.z=-len;p2.add(cap(len*.85,r*.9));
  const c=new THREE.Mesh(new THREE.ConeGeometry(r*.8,.05,6),plain(0x1a1a1a));c.rotation.x=-Math.PI/2;c.position.z=-len*.85-r-.02;c.visible=false;p2.add(c);g.claws.push(c);
  const tip=new THREE.Object3D();tip.position.z=-len*.85-r;p2.add(tip);p1.add(p2);g.add(p1);g.f[k]={p1,p2,tip};};
 mk('t',-s*.05,-.035,.04,.012,.45*s);mk('i',-s*.022,-.07,.055,.0105,0);mk('m',s*.014,-.072,.06,.0105,0);
 g.tip=g.f.i.tip;return g;
}
function monsterHand(g,on){g.claws.forEach(c=>c.visible=on);g.scale.setScalar(on?1.5:1);}
function setCurl(g,i,m,t){const f=g.f;f.i.p1.rotation.x=-i*1.2;f.i.p2.rotation.x=-i*1.3;f.m.p1.rotation.x=-m*1.2;f.m.p2.rotation.x=-m*1.3;f.t.p1.rotation.x=-t*.8;f.t.p2.rotation.x=-t*.9;}

/* ===== АВАТАР (модель как в Gorilla Tag: голова, торс, длинные руки) ===== */
const UP=new THREE.Vector3(0,1,0),_t=new THREE.Vector3(),_e=new THREE.Euler();
const yawOf=q=>{_e.setFromQuaternion(q,'YXZ');return _e.y;};
function seg(m,a,b,r=1){_t.subVectors(b,a);const l=_t.length();m.position.copy(a).addScaledVector(_t,.5);m.scale.set(r,Math.max(l,1e-3),r);m.quaternion.setFromUnitVectors(UP,_t.divideScalar(l||1));}
const DN=new THREE.Vector3(0,-1,0);
function makeAvatar(col,withHands){
 const A={g:new THREE.Group(),k:1};A.skin=new THREE.MeshLambertMaterial({color:col,map:T.fur});
 const white=plain(0xffffff),black=plain(0x111111),S=(r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,12,8),m);
 const head=A.head=new THREE.Group();head.add(S(.15,A.skin));
 for(const sx of[-1,1]){const e=S(.035,white);e.position.set(sx*.06,.03,-.12);head.add(e);const p=S(.018,black);p.position.set(sx*.06,.03,-.15);head.add(p);}
 const nose=S(.025,A.skin);nose.position.set(0,-.01,-.15);head.add(nose);
 const mouth=new THREE.Mesh(new THREE.BoxGeometry(.07,.012,.01),black);mouth.position.set(0,-.06,-.138);head.add(mouth);
 A.maw=new THREE.Group();{const b=new THREE.Mesh(new THREE.BoxGeometry(.14,.08,.03),plain(0x300))
  ;b.position.set(0,-.07,-.13);A.maw.add(b);for(let i=-2;i<=2;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(.012,.04,5),white);t.rotation.x=Math.PI;t.position.set(i*.027,-.045,-.148);A.maw.add(t);}}A.maw.visible=false;head.add(A.maw);
 A.hat=new THREE.Group();{const b=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.02,16),plain(0xc02030));b.position.y=.13;const t=new THREE.Mesh(new THREE.CylinderGeometry(.11,.12,.14,16),plain(0xc02030));t.position.y=.2;A.hat.add(b,t);}
 A.glasses=new THREE.Group();for(const sx of[-1,1]){const r=new THREE.Mesh(new THREE.TorusGeometry(.04,.006,6,14),black);r.position.set(sx*.06,.03,-.145);A.glasses.add(r);}
 head.add(A.hat,A.glasses);
 A.torso=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.35,4,10),A.skin);
 A.scarf=new THREE.Mesh(new THREE.TorusGeometry(.17,.05,8,16),plain(0x2f7fd0));A.scarf.rotation.x=Math.PI/2;A.scarf.position.y=.3;A.torso.add(A.scarf);
 A.neck=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,1,8),A.skin);
 const cyl=()=>new THREE.Mesh(new THREE.CylinderGeometry(.04,.045,1,8),A.skin);
 A.arms=[0,1].map(()=>({a:cyl(),b:cyl(),e:S(.05,A.skin),s:S(.06,A.skin)}));
 A.g.add(head,A.torso,A.neck);A.arms.forEach(o=>A.g.add(o.a,o.b,o.e,o.s));
 if(withHands){A.hL=makeHand('left',A.skin);A.hR=makeHand('right',A.skin);A.g.add(A.hL,A.hR);}
 const right=new THREE.Vector3(),fwd=new THREE.Vector3(),sh=new THREE.Vector3(),el=new THREE.Vector3(),top=new THREE.Vector3(),dn=new THREE.Vector3();
 // o = состояние жертвы: arms[2] (есть ли рука), thin[3] (утончение кожи при растяжении: рука L, рука R, шея)
 A.update=(hp,hq,L,R,down=DN,curl=.3,o=null)=>{
  const K=A.k,yaw=yawOf(hq);right.set(Math.cos(yaw),0,-Math.sin(yaw));fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));
  head.position.copy(hp);head.quaternion.copy(hq);head.scale.setScalar(K);A.torso.scale.setScalar(K);
  A.torso.position.copy(hp).addScaledVector(down,.45*K);A.torso.quaternion.setFromUnitVectors(UP,dn.copy(down).negate());
  top.copy(hp).addScaledVector(down,.2*K);
  seg(A.neck,hp,top,(o?o.thin[2]:1)*K);A.neck.visible=!o||o.thin[2]>0;
  [[L,-1],[R,1]].forEach(([hand,sd],i)=>{const a=A.arms[i],hm=i?A.hR:A.hL,on=!o||o.arms[i],th=(o?o.thin[i]:1)*K;
   [a.a,a.b,a.e,a.s].forEach(m=>m.visible=!!on);if(hm)hm.visible=!!on;if(!on)return;
   sh.copy(top).addScaledVector(right,sd*.22*K).addScaledVector(down,.05*K);
   el.addVectors(sh,hand).multiplyScalar(.5).addScaledVector(down,.1*K).addScaledVector(fwd,-.08*K);
   seg(a.a,sh,el,th);seg(a.b,el,hand,th);a.e.position.copy(el);a.s.position.copy(sh);a.e.scale.setScalar(th);a.s.scale.setScalar(K);
   if(hm){hm.position.copy(hand);hm.rotation.set(0,yaw,0);setCurl(hm,curl,curl,curl);}});};
 return A;
}

/* ===== ИГРОК: состояние кастомизации ===== */
const PAL=[['Серая',0x8a8a8a],['Красная',0xd94040],['Оранжевая',0xf08a2a],['Жёлтая',0xf2d03b],['Зелёная',0x4fb857],['Бирюзовая',0x37b7b0],['Синяя',0x3f6fe0],['Фиолетовая',0x8a55d6],['Розовая',0xe86fb0],['Чёрная',0x2a2a2a]];
const S={color:6,hat:false,glasses:false,scarf:false,mirror:true,menu:false,monster:false};
const player=makeAvatar(PAL[6][1],false);scene.add(player.g);
const P={vel:new THREE.Vector3(),grounded:false};

/* ===== РУКИ (контроллеры VR + запасные позиции для ПК) ===== */
const hands={};
for(const side of['left','right']){const h={side,fake:new THREE.Group(),curl:{i:.25,m:.25,t:.25},ax:[0,0],grab:null,hist:[],gripDown:false,xr:null,gp:null};rig.add(h.fake);h.model=makeHand(side,player.skin);hands[side]=h;}
const hv=Object.values(hands);
const gOf=h=>renderer.xr.isPresenting&&h.xr?h.xr:h.fake;
function attach(){hv.forEach(h=>gOf(h).add(h.model));}attach();
for(let i=0;i<2;i++){const c=renderer.xr.getController(i),gr=renderer.xr.getControllerGrip(i);rig.add(c,gr);
 c.addEventListener('connected',e=>{const h=hands[e.data.handedness];if(!h)return;h.gp=e.data.gamepad;h.xr=gr;attach();});}
renderer.xr.addEventListener('sessionstart',attach);renderer.xr.addEventListener('sessionend',attach);
const handWorld=(h,out)=>out.copy(gOf(h).position).applyQuaternion(rig.quaternion).add(rig.position);
const haptic=(h,a,ms)=>{try{h.gp&&h.gp.hapticActuators&&h.gp.hapticActuators[0].pulse(a,ms);}catch(e){}};

/* ===== КОМПЬЮТЕР: кнопки, которые жмутся пальцем ===== */
const KEYS=[];
{const defs=PAL.map((p,i)=>({l:String((i+1)%10),bg:'#'+p[1].toString(16).padStart(6,'0'),a:()=>{S.color=i;refresh();}}))
 .concat([['Шляпа','hat'],['Очки','glasses'],['Шарф','scarf'],['Зерк.','mirror']].map(([l,k])=>({l,bg:'#556',a:()=>{S[k]=!S[k];refresh();}})),[{l:'Кровь',bg:'#722',a:()=>bloodTest()}]);
 defs.forEach((d,i)=>{const c=i%5,r=i/5|0;
  const lab=new THREE.MeshBasicMaterial({map:cvs(64,64,(g,w,h)=>{g.fillStyle=d.bg;g.fillRect(0,0,w,h);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=4;g.font='bold 22px sans-serif';g.textAlign='center';g.textBaseline='middle';g.strokeText(d.l,32,32);g.fillText(d.l,32,32);})});
  const k=new THREE.Mesh(new THREE.BoxGeometry(.075,.03,.075),plain(0xdddddd));k.position.set(-.24+c*.12,.03,-.12+r*.12);
  const lp=new THREE.Mesh(new THREE.PlaneGeometry(.065,.065),lab);lp.rotation.x=-Math.PI/2;lp.position.y=.0155;k.add(lp);panel.add(k);
  KEYS.push({m:k,x:k.position.x,z:k.position.z,a:d.a,down:false});});}
function pressKey(k){k.a();}

function closest(c,p){return cp.set(Math.min(Math.max(p.x,c.min.x),c.max.x),Math.min(Math.max(p.y,c.min.y),c.max.y),Math.min(Math.max(p.z,c.min.z),c.max.z));}
function collide(){P.grounded=false;
 for(let pass=0;pass<2;pass++){head.copy(camera.position).applyQuaternion(rig.quaternion).add(rig.position);
  const sp=[[head.x,rig.position.y+.3,head.z,.3],[head.x,rig.position.y+.95,head.z,.28],[head.x,head.y,head.z,.2]];
  for(const s of sp){const p=V(s[0],s[1],s[2]);for(const c of colliders){
   if(p.x+s[3]<c.min.x||p.x-s[3]>c.max.x||p.y+s[3]<c.min.y||p.y-s[3]>c.max.y||p.z+s[3]<c.min.z||p.z-s[3]>c.max.z)continue;
   closest(c,p);const d=p.clone().sub(cp),l=d.length();if(l>=s[3])continue;
   const n=l>1e-5?d.divideScalar(l):V(0,1,0),pen=s[3]-l;rig.position.addScaledVector(n,pen);p.addScaledVector(n,pen);
   const vn=P.vel.dot(n);if(vn<0)P.vel.addScaledVector(n,-vn);if(n.y>.6)P.grounded=true;}}}}
function physics(dt,inp){
 // Только руки: касание поверхности (или grip) → тело движется противоположно движению руки. Стики/прыжок в VR не используются.
 let contact=false,rel=null;const K=S.monster?1.2:1,vr=renderer.xr.isPresenting;
 for(const h of hv){const lp=gOf(h).position;if(!h.pl)h.pl=lp.clone();handWorld(h,hw);
  if(h.gripDown&&!h.grab&&!h.hold)for(const c of colliders)if(dist(c,hw)<.15*K){h.grab=hw.clone();h.hist=[];haptic(h,.6,60);break;}
  if(!h.gripDown&&h.grab)h.grab=null;
  let d=null;
  if(h.grab)d=h.grab.clone().sub(hw);
  else if(vr&&!h.hold){for(const c of colliders)if(dist(c,hw)<.08*K){d=h.pl.clone().sub(lp).applyQuaternion(rig.quaternion).multiplyScalar(K);break;}}
  if(d&&d.length()<.6){rig.position.add(d);h.hist.push(d.clone().divideScalar(dt));if(h.hist.length>6)h.hist.shift();contact=true;if(!h.act)haptic(h,.3,25);h.act=true;}
  else{if(h.act&&h.hist.length){const a=V(0,0,0);h.hist.forEach(x=>a.add(x));rel=a.divideScalar(h.hist.length);}h.act=false;h.hist=[];}
  h.pl.copy(lp);}
 if(contact)P.vel.set(0,0,0);
 else{if(rel){P.vel.copy(rel).multiplyScalar(1.15*K);if(P.vel.length()>9*K)P.vel.setLength(9*K);}   // инерция после толчка
  P.vel.y-=9.8*dt;
  if(!vr){camera.getWorldDirection(hw);hw.y=0;hw.normalize();const r=V(-hw.z,0,hw.x),w=hw.multiplyScalar(-inp.mv[1]).addScaledVector(r,inp.mv[0]).multiplyScalar(3.5);if(P.grounded){P.vel.x=w.x;P.vel.z=w.z;if(jumpReq)P.vel.y=5.5;}}  // ПК-запасной вариант
  else if(P.grounded){const k=Math.exp(-6*dt);P.vel.x*=k;P.vel.z*=k;}
  rig.position.addScaledVector(P.vel,dt);}
 jumpReq=false;collide();
 if(rig.position.y<-20)setZone(zone);
 // рывковый поворот правым стиком вокруг головы
 if(Math.abs(inp.turn)>.7&&!turned){rig.updateMatrixWorld(true);const a=camera.getWorldPosition(V(0,0,0));rig.rotation.y-=Math.sign(inp.turn)*Math.PI/6;rig.updateMatrixWorld(true);rig.position.add(a.sub(camera.getWorldPosition(V(0,0,0))));}
 turned=Math.abs(inp.turn)>.5;}

/* ===== ТЫК ПАЛЬЦЕМ: меню и клавиши ===== */
const tip=new THREE.Vector3();
function poke(){if(!renderer.xr.isPresenting)return;
 const keysTouched=new Set();
 for(const h of hv){h.model.tip.getWorldPosition(tip);
  for(const k of KEYS){const l=panel.worldToLocal(tip.clone());
   if(Math.abs(l.x-k.x)<.04&&Math.abs(l.z-k.z)<.04&&l.y<.04&&l.y>-.03)keysTouched.add(k);}}
 for(const k of KEYS){const on=keysTouched.has(k);if(on&&!k.down){pressKey(k);for(const h of hv)haptic(h,.4,30);}k.down=on;k.m.position.y=on?.018:.03;}
 if(!S.menu)return;hands.right.model.tip.getWorldPosition(tip);const l=menuPlane.worldToLocal(tip.clone());
 let idx=-1;if(Math.abs(l.z)<.025){const px=(l.x+.1)/.2*512,py=(.1-l.y)/.2*512,c=Math.floor((px-14)/248),r=Math.floor((py-14)/60);
  if(c>=0&&c<2&&r>=0&&r<8&&(px-14)%248<236&&(py-14)%60<52)idx=r*2+c;}
 if(idx!==hover){const was=hover;hover=idx;if(idx>=0&&was<0){MENU[idx].a();haptic(hands.right,.5,40);}drawMenu();}}

/* ===== ГЛАВНЫЙ ЦИКЛ ===== */
const clock=new THREE.Clock(),hint=document.getElementById('hint');
hint.textContent='ПК: клик — мышь, WASD, Пробел, ЛКМ — кнопки компьютера. Цифры 1–0 цвет, H/G/F/M аксессуары+зеркало, B кровь, Q зона,\nR роль монстра, N + NPC, тесты: Y пополам, U голова, I рука, O бросок, P 3 удара\nVR: хождение ТОЛЬКО руками — отталкивайся/цепляйся (grip = держаться). X — меню на руке (тыкай правым пальцем).\nМонстр: grip у жертвы = схватить (тяни конечность — растянется и оторвётся; обеими за торс — разорвать), бросок в стену = разлёт, кулак (триггер+grip+A/B) + замах = удар';
renderer.xr.addEventListener('sessionstart',()=>hint.style.display='none');renderer.xr.addEventListener('sessionend',()=>hint.style.display='');
const lh=new THREE.Vector3(),rh=new THREE.Vector3(),cq=new THREE.Quaternion(),hpos=new THREE.Vector3(),fd=new THREE.Vector3();
let time=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.025);time+=dt;
 const inp=readInput();monsterUpdate(dt);physics(dt,inp);rig.updateMatrixWorld(true);
 for(const h of hv)setCurl(h.model,h.curl.i,h.curl.m,h.curl.t);
 // аватар игрока: голова чуть позади камеры, чтобы не закрывала обзор
 camera.getWorldPosition(hpos);camera.getWorldDirection(fd);camera.getWorldQuaternion(cq);hpos.addScaledVector(fd,-.2*player.k);
 player.update(hpos,cq,handWorld(hands.left,lh),handWorld(hands.right,rh));
 poke();
 npcs.forEach(n=>updNPC(n,time,dt));updPieces(dt);updGibs(dt);updBlood(dt);
 if(zone===2){backLight.position.copy(rig.position).add(V(0,2.4,0));backLight.intensity=5+Math.sin(time*37)*.4*(Math.sin(time*.7)>.9?3:.3);}
 renderer.render(scene,camera);});
setZone(0);
</script></body></html>
