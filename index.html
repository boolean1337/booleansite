import * as THREE from 'three';

/* ===== ПРИМЕЧАНИЕ =====
 Ног у персонажа НЕТ (как в Gorilla Tag): голова + торс + 2 руки. Движение — только отталкиванием рук
 от поверхностей (хват гриппом/триггером НЕ цепляет: кнопки только гнут пальцы; грипп = хват NPC у монстра).
 Физика своя (сферы vs AABB) вместо cannon-es — легче и стабильнее на Quest. */

/* ===== УТИЛИТЫ ===== */
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z), rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const tex=(w,h,f,px=true)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;if(px)t.magFilter=THREE.NearestFilter;return t};

/* ===== ПРОЦЕДУРНЫЕ ТЕКСТУРЫ ===== */
const noise=(base,amp,s=2)=>tex(64,64,(g,w,h)=>{for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){const v=base+Math.random()*amp|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,y,s,s)}});
const furTex=noise(150,80), chestTex=noise(170,70,3);
const woodTex=tex(128,128,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=`hsl(30,45%,${38+Math.random()*10}%)`;g.fillRect(0,i*16,w,15)}},false);
const concTex=tex(128,128,(g,w,h)=>{g.fillStyle='#8d8f93';g.fillRect(0,0,w,h);for(let i=0;i<500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.1})`;g.fillRect(Math.random()*w,Math.random()*h,4,4)}},false);
const paperTex=tex(256,256,(g,w,h)=>{g.fillStyle='#cdb85a';g.fillRect(0,0,w,h);g.fillStyle='#b9a44a';for(let x=0;x<w;x+=32)g.fillRect(x,0,10,h);for(let i=0;i<300;i++){g.fillStyle=`rgba(90,70,0,${Math.random()*.08})`;g.fillRect(Math.random()*w,Math.random()*h,8,8)}},false);
const carpetTex=tex(64,64,(g,w,h)=>{for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){const v=95+Math.random()*30|0;g.fillStyle=`rgb(${v},${v-15},${v-45})`;g.fillRect(x,y,2,2)}},false);
const bloodTex=tex(64,64,g=>{const r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(140,0,0,1)');r.addColorStop(.6,'rgba(110,0,0,.85)');r.addColorStop(1,'rgba(90,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);for(let i=0;i<8;i++){g.beginPath();g.arc(rnd(10,54),rnd(10,54),rnd(2,5),0,7);g.fill()}},false);
const textTex=(s,col='#fff')=>tex(256,64,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle=col;g.font='bold 44px monospace';g.textAlign='center';g.fillText(s,w/2,46)},false);

/* ===== СЦЕНА / РЕНДЕР / XR ===== */
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb7d4);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,120);
const rig=new THREE.Group();rig.add(camera);scene.add(rig);rig.position.set(0,.5,3);camera.position.y=0;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xfff2e0,0x806c5a,1.1));const sun=new THREE.DirectionalLight(0xffffff,.5);sun.position.set(3,8,4);scene.add(sun);
for(const [x,y,z,c,i,d] of [[0,3.5,0,0xffd9a0,.9,16],[22,2.6,0,0xfff0b0,1,24],[0,4,-14,0xffffff,.8,16]]){const l=new THREE.PointLight(c,i,d);l.position.set(x,y,z);scene.add(l)}

/* ===== МИР И КОЛЛАЙДЕРЫ ===== */
const colliders=[]; // AABB: стены, платформы, стол
function B(x,y,z,w,h,d,mat,col=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);if(col)colliders.push({min:V3(x-w/2,y-h/2,z-d/2),max:V3(x+w/2,y+h/2,z+d/2)});return m}
const wallM=LM({color:0xe8dcc8}), accM=LM({color:0x4a7a9a}), woodM=LM({map:rep(woodTex,8,8)}), concM=LM({map:rep(concTex,6,6)}), carpM=LM({map:rep(carpetTex,20,20)}),

B(-8,2,0,.4,4,16,wallM);B(0,2,8,16,.4,.4,wallM);B(-5,2,-8,6,4,.4,wallM);B(5,2,-8,6,4,.4,wallM);B(8,2,-5,.4,4,6,wallM);B(8,2,5,.4,4,6,wallM);
B(0,2,8,16,4,.4,wallM);B(0,.02,0,5,.02,5,LM({color:0x8a3a3a}),false); // ковёр
for(const [x,z] of [[-6,-6],[6,6],[-6,6],[6,-6]]){B(x,.25,z,.5,.5,.5,LM({color:0x6a4a2a}));const p=new THREE.Mesh(new THREE.SphereGeometry(.5,10,8),LM({color:0x3a9a4a}));p.position.set(x,.9,z);scene.add(p)}
B(-3,.4,-3,1.5,.8,1.5,plat);B(3,.8,-2,1.2,1.6,1.2,plat);B(-4,1.2,5,1,2.4,1,stone);B(5,.5,4,2,1,1,plat);B(0,2.4,-7.6,3,.2,.6,accM,false);

const _mbr=mirror.onBeforeRender;mirror.onBeforeRender=function(...a){if(me)me.head.visible=true;_mbr.apply(this,a);if(me)me.head.visible=false}; // голову видим только в зеркале

/* ===== МОДЕЛЬ ГОРИЛЛЫ / МОНСТРА (без ног) ===== */
const skinM=LM({color:0xb9b9c2}),whiteM=LM({color:0xffffff}),blackM=LM({color:0x050505}),darkM=LM({color:0x333338}),redEye=LM({color:0xff2020,emissive:0x550000});
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d), SP=(r,a=10,b=8)=>new THREE.SphereGeometry(r,a,b);
const M=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};

  const p1=new THREE.Group();p1.position.set(x,0,z);p1.rotation.y=yaw;p1.add(M(BX(.022,.022,.055),mat,0,0,-.0275));
  const p2=new THREE.Group();p2.position.z=-.055;p2.add(M(BX(.02,.02,.05),mat,0,0,-.025));p1.add(p2);h.add(p1);h.fingers.push({p1,p2});
  if(h.fingers.length===2){h.tip=new THREE.Object3D();h.tip.position.z=-.05;p2.add(h.tip)}});
 if(mon)h.scale.setScalar(1.3);return h}
function setCurl(h,c){h.fingers.forEach((f,i)=>{f.p1.rotation.x=-c[i]*1.2;f.p2.rotation.x=-c[i]*1.5})}
function makeArm(mat,mon,side){const g=new THREE.Group(),r=mon?.085:.06,geo=new THREE.CylinderGeometry(r,r*.85,1,8);
 g.up=new THREE.Mesh(geo,mat);g.fo=new THREE.Mesh(geo,mat);g.hand=makeHand(mat,mon,side);g.add(g.up,g.fo,g.hand,M(SP(r*1.3),mat));g.side=side;return g}
const _m=V3(),_e=V3(),_u=V3(),_dir=V3();

// Двухзвенная рука: плечо (0,0,0) → локоть → кисть hl. Если далеко — растягивается.
function poseArm(g,hl,L,orient=true){const d=hl.length()||1e-3,l=Math.max(L,d/2+1e-3);_m.copy(hl).multiplyScalar(.5);_u.copy(hl).divideScalar(d);
 _e.set(g.side*.6,-.4,.8);_e.addScaledVector(_u,-_e.dot(_u)).normalize().multiplyScalar(Math.sqrt(l*l-d*d/4)).add(_m);
 if(orient){_dir.subVectors(hl,_e).normalize();g.hand.quaternion.setFromUnitVectors(NEGZ,_dir)}
 seg(g.up,ZERO,_e);seg(g.fo,_e,hl);g.hand.position.copy(hl)}
function makeGorilla(color,mon){
 const s=mon?1.6:1,G={mon,L:mon?.52:.4,rest:{}},root=G.root=new THREE.Group();root.scale.setScalar(s);
 const fur=G.fur=LM({map:furTex,color,side:THREE.DoubleSide});
 const head=G.head=new THREE.Group();root.add(head);head.add(M(SP(mon?.2:.17,12,10),fur));

 for(const sx of[-1,1]){head.add(M(SP(.04,8,6),mon?redEye:whiteM,sx*.055,.035,-.15));head.add(M(SP(.02,6,5),blackM,sx*.055,.035,-.188));head.add(M(SP(.045,6,5),fur,sx*.17,0,0))}

 const up=M(new THREE.SphereGeometry(1,12,6,0,6.283,0,1.5708),fur),lo=M(new THREE.SphereGeometry(1,12,6,0,6.283,1.5708,1.5708),fur);up.scale.set(...sc);lo.scale.set(...sc);
 const chest=new THREE.Group();const cp=M(SP(1),LM({map:chestTex}),0,0,-sc[2]*.9);cp.scale.set(sc[0]*.6,sc[1]*.65,.05);chest.add(cp);
 const lbl=M(new THREE.PlaneGeometry(.2,.05),new THREE.MeshBasicMaterial({map:textTex('RILLA'),transparent:true}),0,.05,-sc[2]*.9-.053);lbl.rotation.y=Math.PI;chest.add(lbl);

/* ===== ИГРОК ===== */
const COLORS=[['Классика',0x4a5170],['Красный',0xc03030],['Синий',0x2f5fd0],['Зелёный',0x2e9a4a],['Жёлтый',0xd8b630],['Фиолет',0x8a3ad0],['Оранж',0xe07a20],['Розовый',0xe070b0],['Серый',0x888888],['Чёрный',0x222222]];
const P={vel:V3(),monster:false,color:0,hat:false,glasses:false,grounded:false,snap:false};
let me=null;
function buildMe(){if(me)scene.remove(me.root);me=makeGorilla(COLORS[P.color][1],P.monster);scene.add(me.root);me.head.visible=false;
 me.hatM=new THREE.Group();me.hatM.add(M(new THREE.CylinderGeometry(.2,.2,.02,14),LM({color:0x222222}),0,.17,0),M(new THREE.CylinderGeometry(.11,.12,.14,14),LM({color:0x222222}),0,.25,0));me.head.add(me.hatM);
 me.glM=new THREE.Group();for(const sx of[-1,1])me.glM.add(M(new THREE.TorusGeometry(.04,.008,6,12),blackM,sx*.055,.035,-.195));me.glM.add(M(BX(.03,.008,.008),blackM,0,.035,-.195));me.head.add(me.glM);
 me.hatM.visible=P.hat;me.glM.visible=P.glasses}
function setColor(i){P.color=i;me.fur.color.setHex(COLORS[i][1]);drawScreen()}
function setRole(mon){P.monster=mon;P.color=mon?1:0;buildMe();drawScreen()}

/* ===== РУКИ / ВВОД ===== */
const mkTether=()=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,8),LM({color:0xd86a6a}));m.visible=false;scene.add(m);return m};
const newHand=side=>({side,has:false,on:false,ctrl:null,gp:null,grip:false,wp:V3(),vis:V3(),vel:V3(),q:new THREE.Quaternion(),lp:null,dl:V3(),c:[0,0,0],tgt:[0,0,0],hold:null,tether:mkTether(),pt:0});
const Hs={left:newHand(-1),right:newHand(1)},HL=[Hs.left,Hs.right];
for(let i=0;i<2;i++){const c=renderer.xr.getController(i),g=renderer.xr.getControllerGrip(i);rig.add(c,g);

 c.addEventListener('disconnected',()=>{const h=c.userData.h;if(h){h.has=false;h.gp=null}})}
const keys={};let btnPrev=false;
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyM')menu.visible=!menu.visible;const n=+e.key;if(n>=1&&n<=ACTIONS.length&&e.key.length===1)ACTIONS[n-1][1]()});
addEventListener('keyup',e=>keys[e.code]=0);

addEventListener('mousemove',e=>{if(document.pointerLockElement){rig.rotation.y-=e.movementX*.002;camera.rotation.x=clamp(camera.rotation.x-e.movementY*.002,-1.5,1.5)}});
addEventListener('mousedown',e=>{if(!document.pointerLockElement)return;(e.button===0?Hs.right:Hs.left).pt=.22});addEventListener('contextmenu',e=>e.preventDefault());
function readInput(dt){const xr=renderer.xr.isPresenting;

  if(xr&&h.gp){const b=h.gp.buttons,v=i=>b[i]?b[i].value:0;h.grip=v(1)>.5;h.tgt=[Math.max(v(3),v(4),v(5)),v(0),v(1)]}
  else if(!xr){const g=!!keys.KeyG;h.grip=g;h.tgt=h.pt>0?[1,1,1]:[0,0,g?1:0]}
  for(let i=0;i<3;i++)h.c[i]+=(h.tgt[i]-h.c[i])*Math.min(1,18*dt)}

  if(r){const ax=r.axes[2]||0;if(Math.abs(ax)>.7&&!P.snap){P.snap=true;const q=new THREE.Quaternion().setFromAxisAngle(Y,-Math.sign(ax)*Math.PI/6),off=rig.position.clone().sub(headW).applyQuaternion(q);rig.position.copy(headW).add(off);rig.quaternion.premultiply(q)}else if(Math.abs(ax)<.3)P.snap=false}}}

/* ===== ФИЗИКА СФЕР vs AABB ===== */
const _n=V3(),_cp=V3();

 for(const c of colliders){const a=c.min,b=c.max;if(p.x<a.x-r||p.x>b.x+r||p.y<a.y-r||p.y>b.y+r||p.z<a.z-r||p.z>b.z+r)continue;
  _cp.set(clamp(p.x,a.x,b.x),clamp(p.y,a.y,b.y),clamp(p.z,a.z,b.z));_n.subVectors(p,_cp);const l=_n.length();if(l>=r)continue;

 resolve.n.normalize();return hit}resolve.n=V3();
