  if(hs.length===2&&!puller){if(hs[0].vis.distanceTo(hs[1].vis)>hs[1].hold.sep0+.9){splitNPC(n);for(const h of hs)h.hold=null;continue}}
  if(puller){const part=puller.hold.part,key=part;
   if(part==='head'){const d=puller.vis.distanceTo(r.position);G.head.position.copy(r.worldToLocal(puller.vis.clone()));stretch(puller,r.position,puller.vis,d,1.3*s);if(d>1.3*s){tearHead(n,puller);puller.hold=null;continue}}
   else if(n.limb[key]){const a=G[key],sock=r.localToWorld(G.rest[key].clone()),d=puller.vis.distanceTo(sock);a.position.copy(r.worldToLocal(puller.vis.clone()).add(V3(0,.75,0)));stretch(puller,sock,puller.vis,d,1.5*s);
    if(d>1.5*s){tearLimb(n,key,puller);puller.hold=null;continue}}}
  else{G.head.position.lerp(ZERO,.3);for(const k of['armL','armR'])if(n.limb[k])G[k].position.lerp(G.rest[k],.3)}}
 // удары кулаком (монстр): сжатые пальцы + резкое движение
 for(const h of HL){if(!h.on||h.hold)continue;const fist=(h.c[0]+h.c[1]+h.c[2])/3>.7;if(!fist||h.vel.length()<3)continue;
  for(const n of npcs){if(n.gone||n.state==='held'||t<n.hitCd)continue;if(partPos(n,'torso').distanceTo(h.vis)>.55*n.G.root.scale.x)continue;
   n.hitCd=t+.45;if(t-n.lastHit>8)n.hits=0;n.lastHit=t;n.hits++;snd(60,.15,'square',.2);const dir=h.vel.clone().normalize();
   if(n.hits>=3&&n.alive){const tor=n.G.torso;tor.scale.set(.85,.9,.6);const dent=M(SP(.12),LM({color:0x5a0a0a}),0,.02,-.2);dent.scale.z=.35;tor.add(dent);die(n);toRag(n,t,false,false);n.vel.copy(dir).multiplyScalar(4);n.vel.y+=2}
   else if(n.alive){toRag(n,t);n.vel.copy(dir).multiplyScalar(4);n.vel.y+=2}
   else{n.vel.copy(dir).multiplyScalar(3)}}}}
function stretch(h,a,b,d,lim){const m=h.tether;m.visible=true;seg(m,a,b);m.scale.x=m.scale.z=.05*clamp(1.1-d/lim,.15,1)}

/* ===== БЕНЗОПИЛА МОНСТРА: триггер правой руки ===== */
const _sa=V3(),_sb=V3(),_sp=V3();let sawO,sawG;
function sawSound(on){if(!on&&!sawO)return;try{AC=AC||new AudioContext();if(!sawO){sawO=AC.createOscillator();sawG=AC.createGain();sawO.type='sawtooth';sawO.frequency.value=70;sawG.gain.value=0;sawO.connect(sawG).connect(AC.destination);sawO.start()}sawG.gain.value=on?.06:0;sawO.frequency.value=on?90+Math.random()*30:70}catch(e){}}
function sawLogic(dt,t){const saw=me.saw,h=Hs.right;let run=false;chainT.offset.x-=dt*.5;
 if(saw){run=h.on&&h.c[1]>.6;if(run)chainT.offset.x-=dt*8;if(me.jaw)me.jaw.rotation.x=.15+(run?.2*Math.sin(t*30)+.15:0);
  if(run){saw.base.getWorldPosition(_sa);saw.tip.getWorldPosition(_sb);
   for(const n of npcs){if(n.gone||t<(n.sawCd||0))continue;const s=n.G.root.scale.x;let hit=false;
    for(let i=0;i<=4&&!hit;i++){_sp.lerpVectors(_sa,_sb,i/4);
     for(const key of['armL','armR'])if(n.limb[key]&&partPos(n,key).distanceTo(_sp)<.22*s){n.sawCd=t+.3;tearLimb(n,key,null);hit=true;break}
     if(hit)break;
     if(n.G.head.parent!==scene&&partPos(n,'head').distanceTo(_sp)<.25*s){n.sawCd=t+.3;tearHead(n,null);hit=true;break}
     if(partPos(n,'torso').distanceTo(_sp)<.32*s){n.sawCd=t+.08;n.sawT=(n.sawT||0)+.08;burstGibs(_sp,6,3);if(n.sawT>.5){splitNPC(n);hit=true}break}}}}}
 sawSound(run)}

/* ===== ТЕРМИНАЛ, МЕНЮ НА РУКЕ, ДЕЙСТВИЯ ===== */
const nearestNPC=()=>{let b=null,bd=1e9;for(const n of npcs){if(n.gone)continue;const d=n.G.root.position.distanceTo(headW);if(d<bd){bd=d;b=n}}return b};
const fwd=()=>{camera.getWorldDirection(_d);_d.y=0;return _d.normalize().clone()};
const spawnAt=(mode,mon)=>{const f=fwd(),p=headW.clone().addScaledVector(f,2);p.y=0;const n=spawnNPC(p,mode,mon);n.G.root.rotation.y=Math.atan2(f.x,f.z)};
const ACTIONS=[['Цвет ▶',()=>setColor((P.color+1)%COLORS.length)],['Шляпа',()=>{P.hat=!P.hat;me.hatM.visible=P.hat}],['Очки',()=>{P.glasses=!P.glasses;me.glM.visible=P.glasses}],['Зеркало',()=>{mirror.visible=!mirror.visible}],
 ['Роль: '+'игрок/монстр',()=>setRole(!P.monster)],['NPC стоит',()=>spawnAt('stand')],['NPC ходит',()=>spawnAt('walk')],['NPC рэгдолл',()=>spawnAt('rag')],['NPC монстр',()=>spawnAt('stand',true)],
 ['Тест: оторвать руку',()=>{const n=nearestNPC();if(n){const k=n.limb.armR?'armR':'armL';tearLimb(n,k,null)}}],['Тест: оторвать голову',()=>{const n=nearestNPC();if(n&&n.G.head.parent!==scene)tearHead(n,null)}],
 ['Тест: разорвать',()=>{const n=nearestNPC();if(n)splitNPC(n)}],['Тест: бросок в стену',()=>{const n=nearestNPC();if(n){const f=fwd();n.G.root.position.copy(headW).addScaledVector(f,1.2);n.vel.copy(f).multiplyScalar(14);n.state='thrown';n.spin.set(3,2,1)}}],
 ['Тест: 3 удара',()=>{const n=nearestNPC();if(n&&n.alive){n.G.torso.scale.set(.85,.9,.6);die(n);toRag(n,0,false,false);n.vel.set(0,3,0)}}]];
// Меню на левой руке: открывается кнопкой X, тыкаем указательным пальцем правой руки
const MCOLS=3,MROWS=5,menuTex=tex(300,400,()=>{},false),menu=new THREE.Mesh(new THREE.PlaneGeometry(.3,.4),new THREE.MeshBasicMaterial({map:menuTex,transparent:true,side:THREE.DoubleSide}));
menu.visible=false;menu.position.set(0,.15,.1);menu.rotation.x=-1.05;let menuHot=-1;const menuG=renderer.xr.getControllerGrip(0);
function drawMenu(){const g=menuTex.image.getContext('2d');g.fillStyle='#101820e8';g.fillRect(0,0,300,400);g.font='bold 15px sans-serif';g.textAlign='center';
 ACTIONS.forEach((a,i)=>{const x=(i%MCOLS)*100,y=(i/MCOLS|0)*80;g.fillStyle=i===menuHot?'#3a9a4a':'#2a4a6a';g.fillRect(x+4,y+4,92,72);g.fillStyle='#fff';const w=a[0].split(' ');w.forEach((t,j)=>g.fillText(t,x+50,y+36+j*17-(w.length-1)*8))});menuTex.needsUpdate=true}
Hs.left.menuAttached=false;
function attachMenu(){const c=Hs.left.ctrl;if(c&&menu.parent!==c)c.add(menu)}
// Клавиши терминала (в зале у северной стены): 10 цветов + шляпа/очки/зеркало/роль
const keyObjs=[],scr=tex(512,128,()=>{},false),scrM=new THREE.Mesh(new THREE.PlaneGeometry(1.4,.35),new THREE.MeshBasicMaterial({map:scr}));
B(4,.35,-7.4,2,.7,.7,LM({color:0x3a3a42}));scrM.position.set(4,1.2,-7.7);scrM.rotation.x=-.25;scene.add(scrM);
function drawScreen(){const g=scr.image.getContext('2d');g.fillStyle='#021';g.fillRect(0,0,512,128);g.fillStyle='#4f4';g.font='bold 30px monospace';g.textAlign='left';g.fillText('RILLA TERMINAL',16,38);g.fillText('ЦВЕТ: '+COLORS[P.color][0],16,78);g.fillText('РОЛЬ: '+(P.monster?'МОНСТР':'ИГРОК'),16,114);g.fillStyle='#'+COLORS[P.color][1].toString(16).padStart(6,'0');g.fillRect(400,50,90,60);scr.needsUpdate=true}
function addKey(x,z,label,col,fn){const m=new THREE.Mesh(BX(.1,.04,.1),new THREE.MeshBasicMaterial({map:tex(64,64,g=>{g.fillStyle=col;g.fillRect(0,0,64,64);g.fillStyle='#fff';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText(label,32,40)},false)}));m.position.set(x,.72,z);scene.add(m);keyObjs.push({m,fn,cd:0,y:.72})}
COLORS.forEach((c,i)=>addKey(3.4+i*.13,-7.15,String(i),'#'+c[1].toString(16).padStart(6,'0'),()=>setColor(i)));
[['Шл',1],['Оч',2],['Зер',3],['Роль',4]].forEach(([l,i],j)=>addKey(3.6+j*.2,-6.95,l,'#445',ACTIONS[i][1]));
function pokeUI(t){const h=Hs.right;if(!renderer.xr.isPresenting||!h.on)return;
 const a=me.arms.right.hand.tip.getWorldPosition(V3());
 for(const k of keyObjs){k.m.position.y+=(k.y-k.m.position.y)*.3;if(t>k.cd&&a.distanceTo(k.m.position)<.09&&a.y<.9){k.cd=t+.6;k.m.position.y=k.y-.02;k.fn();snd(600,.08,'square',.1)}}
 if(menu.visible){const l=menu.worldToLocal(a.clone());let hot=-1;if(Math.abs(l.z)<.04&&Math.abs(l.x)<.15&&Math.abs(l.y)<.2){hot=Math.floor((l.x+.15)/.3*MCOLS)+Math.floor((.2-l.y)/.4*MROWS)*MCOLS;if(hot>=ACTIONS.length)hot=-1}
  if(hot>=0&&hot!==menuHot&&t>(menu.cd||0)){menu.cd=t+.5;ACTIONS[hot][1]();snd(500,.08,'square',.1)}if(hot!==menuHot){menuHot=hot;drawMenu()}}}

/* ===== HUD (ПК) ===== */
const hud=document.getElementById('hud');hud.innerHTML='<b>Rilla</b> <span id="fps"></span><br>'+ACTIONS.map((a,i)=>`<button data-i="${i}">${i+1<10?i+1+'. ':''}${a[0]}</button>`).join('')+'<small>ПК: клик — мышь, WASD, Пробел — прыжок, ЛКМ/ПКМ — удар правой/левой, G — хват (монстр), M — меню, 1–9 — кнопки. В VR — кнопка «Enter VR» внизу.</small>';
hud.onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){ACTIONS[+i][1]();e.target.blur()}};

/* ===== СТАРТ ===== */
buildMe();drawScreen();drawMenu();
spawnNPC(V3(-2,0,-12),'stand',false,0x2f5fd0).G.root.rotation.y=Math.PI;
spawnNPC(V3(2,0,-14),'walk',false,0xc03030);
spawnNPC(V3(0,0,-16),'rag',false,0x2e9a4a).alive=false;
const clock=new THREE.Clock();let fpsT=0,fpsN=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 readInput(dt);physics(dt);attachMenu();updMe();monsterLogic(dt,t);sawLogic(dt,t);for(const n of npcs)updNPC(n,dt,t);effects(dt);pokeUI(t);
 fpsT+=dt;fpsN++;if(fpsT>.5){const f=document.getElementById('fps');if(f)f.textContent=Math.round(fpsN/fpsT)+' fps · '+(P.monster?'МОНСТР':'ИГРОК');fpsT=0;fpsN=0}
 renderer.render(scene,camera)});
</script></body></html>
